      source:
        $ref: "../../code_samples/csharp/products/deleteProduct.cs"
    - lang: PHP
      source:
        $ref: "../../code_samples/PHP/products/deleteProduct.php"
    - lang: Python
      source:
        $ref: "../../code_samples/python/products/deleteProduct.py"